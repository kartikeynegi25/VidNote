<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidNote</title>
    <style>
        body {
            width: 300px;
            font-family: Arial, sans-serif;
            padding: 12px;
            margin: 0;
            background: white;
        }

        h3 {
            margin: 0;
            border-bottom: 1px solid #ccc;
            padding-bottom: 8px;
        }

        .top-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        #note-Input{
            flex: 1;
            padding: 6px;
            border: 1px solid #999;
            border-radius: 3px
        }

        #add-btn{
            background-color: black;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px;
        }

        #add-btn:hover{
            background-color: #333;
        }

        #notes-list{
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .note{
            background: #f4f4f4;
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-link{
            font-weight: bold;
            color: blue;
            cursor: pointer;
            margin-right: 5px
        }

        .time-link:hover {
            text-decoration: underline;
        }

        .del-btn{
            background: none;
            border: none;
            color: red;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover{
            background: #ffcccc;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h3>🎬 VidNote</h3>

    <div class="top-bar">
        <input type="text" id="note-input" placeholder="Type your note here..." />
        <button id="add-btn">Add</button>
    </div>

    <ul id="notes-list"></ul>

    <script src="popup.js"></script>+
    
    
</body>
</html>
